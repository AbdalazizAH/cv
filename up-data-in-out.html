<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اضافة معاملة جديدة</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary-color: #6d28d9;
            --secondary-color: #4c1d95;
            --background-color: #f3f4f6;
            --text-color: #1f2937;
            --hover-color: #5b21b6;
            --card-bg: #ffffff;
            --border-color: #d1d5db;
            --neumorphic-light: #ffffff;
            --neumorphic-dark: #d1d9e6;
        }

        .dark-mode {
            --primary-color: #8b5cf6;
            --secondary-color: #7c3aed;
            --background-color: #1f2937;
            --text-color: #f3f4f6;
            --hover-color: #6d28d9;
            --card-bg: #374151;
            --border-color: #4b5563;
            --neumorphic-light: #2d3748;
            --neumorphic-dark: #1a202c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 
                20px 20px 60px var(--neumorphic-dark),
                -20px -20px 60px var(--neumorphic-light);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--secondary-color);
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
            transition: color 0.3s;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 8px;
            transition: all 0.3s;
            background-color: var(--background-color);
            color: var(--text-color);
            box-shadow: 
                inset 2px 2px 5px var(--neumorphic-dark),
                inset -2px -2px 5px var(--neumorphic-light);
        }

        input:focus, select:focus {
            outline: none;
            box-shadow: 
                inset 4px 4px 8px var(--neumorphic-dark),
                inset -4px -4px 8px var(--neumorphic-light);
            transform: scale(1.02);
        }

        button {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                4px 4px 8px var(--neumorphic-dark),
                -4px -4px 8px var(--neumorphic-light);
        }

        button:hover {
            background-color: var(--hover-color);
            transform: translateY(-2px);
            box-shadow: 
                6px 6px 12px var(--neumorphic-dark),
                -6px -6px 12px var(--neumorphic-light);
        }

        button:active {
            transform: scale(0.98);
            box-shadow: 
                2px 2px 4px var(--neumorphic-dark),
                -2px -2px 4px var(--neumorphic-light);
        }

        .error, .success {
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .error {
            background-color: #FEE2E2;
            color: #DC2626;
        }

        .success {
            background-color: #D1FAE5;
            color: #059669;
        }

        .show-message {
            opacity: 1;
        }

        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: var(--card-bg);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                2px 2px 5px var(--neumorphic-dark),
                -2px -2px 5px var(--neumorphic-light);
        }

        .dark-mode-toggle:hover {
            transform: scale(1.1);
        }

        .dark-mode-toggle i {
            font-size: 1.2rem;
            color: var(--text-color);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.75rem;
            }
            label {
                font-size: 0.9rem;
            }
            input, select {
                font-size: 0.9rem;
                padding: 0.6rem 0.8rem;
            }
            button {
                font-size: 0.9rem;
                padding: 0.6rem 0.8rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>

    <div class="container animate__animated animate__fadeIn">
        <h1>ألغاء معاملات دخول وخروج</h1>
        <form id="UpdataForm">
            <label for="sheet_name">اسم الزبون</label>
            <input type="text" id="sheet_name" name="sheet_name" required>

            <label for="transaction_id">رقم المعاملة</label>
            <input type="number" id="transaction_id" name="transaction_id" required>



            <button type="submit" class="animate__animated animate__pulse">إرسال</button>

            <div id="errorMessage" class="error">حدث خطأ.</div>
            <div id="successMessage" class="success">تم اضافة المعاملة</div>
        </form>
        <div style="text-align:center; padding-top:2px; color:var(--primary-color);">
            <a href="index.html" class="hover:underline transition-all duration-300">عرض البيانات</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
    const form = document.getElementById('UpdataForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const submitButton = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
        submitButton.disabled = true;

        const formData = {
            sheet_name: document.getElementById('sheet_name').value,
            transaction_id: parseFloat(document.getElementById('transaction_id').value),
    
        };
        const apiUrls = [
            'https://fastapi-project-ten.vercel.app/api/v1/update-in-out-trans/',
            'https://excle-fastapi-vercle.vercel.app/api/v1/update-trns-in-out-excl/'
        ];

        try {
            const requests = apiUrls.map(url => 
                fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': '1'  // Replace with your actual API key
                    },
                    body: JSON.stringify(formData)
                })
            );

            const responses = await Promise.all(requests);

            const allSuccess = responses.every(response => response.ok);
            
            if (allSuccess) {
                successMessage.classList.add('show-message');
                errorMessage.classList.remove('show-message');
                form.reset();
                console.log('Success: Data sent to both APIs');

                anime({
                    targets: successMessage,
                    scale: [0.9, 1],
                    opacity: [0, 1],
                    duration: 1000,
                    easing: 'easeOutElastic(1, .5)'
                });
            } else {
                const errorData = await Promise.all(responses.map(response => response.json()));
                throw new Error(JSON.stringify(errorData));
            }
        } catch (error) {
            console.error('Error:', error);
            errorMessage.classList.add('show-message');
            errorMessage.innerHTML = 'خطأ في إرسال النموذج إلى أحد الـ APIs: ' + error.message;
            successMessage.classList.remove('show-message');

            anime({
                targets: errorMessage,
                translateX: [-10, 10, -10, 10, 0],
                duration: 500,
                easing: 'easeInOutQuad'
            });
        } finally {
            submitButton.innerHTML = 'إرسال';
            submitButton.disabled = false;
        }
    });

        // Background animation
        anime({
            targets: '.container',
            backgroundColor: ['hsl(230, 50%, 95%)', 'hsl(230, 50%, 90%)', 'hsl(230, 50%, 95%)'],
            duration: 10000,
            direction: 'alternate',
            loop: true,
            easing: 'easeInOutQuad'
        });
    </script>
</body>
</html>

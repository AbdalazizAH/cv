
</body>
</html>
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض البيانات</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary-color: #6d28d9;
            --secondary-color: #4c1d95;
            --background-color: #f3f4f6;
            --text-color: #1f2937;
            --hover-color: #5b21b6;
            --card-bg: #ffffff;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        nav {
            background-color: var(--secondary-color);
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .nav-links a, #darkModeToggle {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s, transform 0.3s;
        }

        .nav-links a:hover, #darkModeToggle:hover {
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        h1 {
            color: var(--secondary-color);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }

        input[type="text"], button {
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.2);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.3s;
        }

        button:hover {
            background-color: var(--hover-color);
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--secondary-color);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.875rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: rgba(109, 40, 217, 0.05);
        }

        .red-row { background-color: #fecaca; }
        .green-row { background-color: #bbf7d0; }
        .white-row { background-color: var(--card-bg); }

        #darkModeToggle {
            background-color: var(--secondary-color);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        #darkModeToggle:hover {
            background-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .dark-mode {
            --background-color: #111827;
            --text-color: #f3f4f6;
            --secondary-color: #4c1d95;
            --card-bg: #1f2937;
            --border-color: #374151;
        }

        @media screen and (max-width: 768px) {
            table { font-size: 0.875rem; }
            th, td { padding: 0.75rem; }
            input[type="text"] { width: 100%; margin-bottom: 0.75rem; }
            .nav-links { display: flex; flex-direction: column; align-items: center; }
            .nav-links a, #darkModeToggle { margin: 10px 0; }
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .pagination button {
            margin: 0 0.25rem;
        }

        #loader {
            display: none;
            text-align: center;
            padding: 1rem;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav class="flex flex-col md:flex-row justify-between items-center">
        <div class="logo animate__animated animate__bounceIn">DIS</div>
        <div class="nav-links">
            <a href="#" class="animate__animated animate__fadeIn">لوحت التحكم</a>
            <a href="add-trans.html" class="animate__animated animate__fadeIn">اضافت معاملات</a>
            <a href="up-data-full.html" class="animate__animated animate__fadeIn">ألغاء معاملات</a>
            <a href="add-trans-in-out.html" class="animate__animated animate__fadeIn">اضافت معاملات دخول وخروج</a>
            <a href="up-data-in-out.html" class="animate__animated animate__fadeIn">ألغاء معاملات دخول وخروج</a>
            <!-- <button id="darkModeToggle" class="animate__animated animate__fadeIn"> Theme</button> -->
        </div>
    </nav>

    <div class="container">
        <h1 class="animate__animated animate__fadeInDown">عرض البيانات </h1>
        <div class="card animate__animated animate__fadeInUp">
            <form id="nameForm" class="flex flex-col md:flex-row justify-center items-center gap-4">
                <input type="text" id="nameInput" placeholder="Enter name" value="ail" class="flex-grow md:flex-grow-0 md:w-64">
                <button type="submit" class="w-full md:w-auto">عرض</button>
            </form>
        </div>
        <div id="loader">
            <div class="spinner"></div>
            <p>Loading data...</p>
        </div>
        <div class="overflow-x-auto">
            <table id="transactionTable">
                <thead>
                    <tr>
                        <th>رقم المعاملة</th>
                        <th>التاريخ</th>
                        <th>الاسم</th>
                        <th>البلد</th>
                        <th>المدينة</th>
                        <th>القيمة</th>
                        <th>السعر</th>
                        <th>نوع العملية</th>
                        <th>مدين</th>
                        <th>مدان</th>
                        <th>المجموع</th>
                        <th>العمولة</th>
                        <th>دولار</th>
                        <th>يورو</th>
                        <th>مصري</th>
                        <th>تونسي</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
        <div class="pagination">
            <button id="prevPage" disabled>السابق</button>
            <span id="pageInfo"></span>
            <button id="nextPage">التالي</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script>
        let currentPage = 1;
        const itemsPerPage = 10;
        let allData = [];

        async function fetchData(name) {
            try {
                document.getElementById('loader').style.display = 'block';
                const response = await fetch(`https://trns-app.vercel.app/api/des-all/?name=${name}`);
                allData = await response.json();
                renderTable();
                updatePagination();
                document.getElementById('loader').style.display = 'none';
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('loader').style.display = 'none';
            }
        }

        function renderTable() {
            const tableBody = document.querySelector('#transactionTable tbody');
            tableBody.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = allData.slice(start, end);

            pageData.forEach((item, index) => {
                const row = document.createElement('tr');
                
                if (item.cancel && item.transaction_type === "رصيد") {
                    row.className = 'red-row';
                } else if (item.cancel) {
                    row.className = 'red-row';
                } else if (item.transaction_type === "رصيد") {
                    row.className = 'green-row';
                } else {
                    row.className = 'white-row';
                }

                row.innerHTML = `
                    <td>${item.transaction_number}</td>
                    <td>${item.date}</td>
                    <td>${item.name}</td>
                    <td>${item.country}</td>
                    <td>${item.city}</td>
                    <td>${item.value}</td>
                    <td>${item.price}</td>
                    <td>${item.transaction_type}</td>
                    <td>${item.debtor}</td>
                    <td>${item.creditor}</td>
                    <td>${item.total}</td>
                    <td>${item.commission}</td>
                    <td>${item.dcountry_crancy}</td>
                    <td>${item.ucountry_crancy}</td>
                    <td>${item.mcountry_crancy}</td>
                    <td>${item.tcountry_crancy}</td>
                `;
                tableBody.appendChild(row);

                gsap.from(row, {
                    opacity: 0,
                    y: 20,
                    duration: 0.5,
                    delay: index * 0.1
                });
            });
        }

        function updatePagination() {
            const totalPages = Math.ceil(allData.length / itemsPerPage);
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        document.getElementById('nameForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('nameInput').value;
            currentPage = 1;
            fetchData(name);
        });

        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
                updatePagination();
            }
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            const totalPages = Math.ceil(allData.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
                updatePagination();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            gsap.from('h1', { opacity: 0, y: -50, duration: 1, ease: 'power3.out' });
            gsap.from('.card', { opacity: 0, y: 50, duration: 1, delay: 0.5, ease: 'power3.out' });
            gsap.from('table', { opacity: 0, scale: 0.9, duration: 1, delay: 1, ease: 'power3.out' });
            
            fetchData('ail');
        });
    </script>
</body>
</html>

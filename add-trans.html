<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اضافة معاملة جديدة</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #1d4ed8;
            --background-color: #ffffff;
            --text-color: #1f2937;
            --hover-color: #2563eb;
            --card-bg: #f3f4f6;
            --border-color: #d1d5db;
        }


        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 
                20px 20px 60px var(--neumorphic-dark),
                -20px -20px 60px var(--neumorphic-light);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--secondary-color);
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
            transition: color 0.3s;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 8px;
            transition: all 0.3s;
            background-color: var(--background-color);
            color: var(--text-color);
            box-shadow: 
                inset 2px 2px 5px var(--neumorphic-dark),
                inset -2px -2px 5px var(--neumorphic-light);
        }

        input:focus, select:focus {
            outline: none;
            box-shadow: 
                inset 4px 4px 8px var(--neumorphic-dark),
                inset -4px -4px 8px var(--neumorphic-light);
            transform: scale(1.02);
        }

        button {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                4px 4px 8px var(--neumorphic-dark),
                -4px -4px 8px var(--neumorphic-light);
        }

        button:hover {
            background-color: var(--hover-color);
            transform: translateY(-2px);
            box-shadow: 
                6px 6px 12px var(--neumorphic-dark),
                -6px -6px 12px var(--neumorphic-light);
        }

        button:active {
            transform: scale(0.98);
            box-shadow: 
                2px 2px 4px var(--neumorphic-dark),
                -2px -2px 4px var(--neumorphic-light);
        }

        .error, .success {
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .error {
            background-color: #FEE2E2;
            color: #DC2626;
        }

        .success {
            background-color: #D1FAE5;
            color: #059669;
        }

        .show-message {
            opacity: 1;
        }

        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: var(--card-bg);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                2px 2px 5px var(--neumorphic-dark),
                -2px -2px 5px var(--neumorphic-light);
        }

        .dark-mode-toggle:hover {
            transform: scale(1.1);
        }

        .dark-mode-toggle i {
            font-size: 1.2rem;
            color: var(--text-color);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.75rem;
            }
            label {
                font-size: 0.9rem;
            }
            input, select {
                font-size: 0.9rem;
                padding: 0.6rem 0.8rem;
            }
            button {
                font-size: 0.9rem;
                padding: 0.6rem 0.8rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>

    <div class="container animate__animated animate__fadeIn">
        <h1>اضافة معاملة</h1>
        <form id="addTransactionForm">
            <label for="customer_name">اسم الزبون</label>
            <input type="text" id="customer_name" name="customer_name" required>
            
            <label for="name">المستلم</label>
            <input type="text" id="name" name="name" required>
            
            <label for="country">البلد</label>
            <select id="country" name="country" required>
                <option value="تونسي">تونسي</option>
                <option value="مصري">مصري</option>
                <option value="دولار">دولار</option>
                <option value="يورو">يورو</option>
            </select>

            <label for="city">المدينة</label>
            <input type="text" id="city" name="city" required>
            
            <label for="transaction_type">نوع العملية</label>
            <select id="transaction_type" name="transaction_type" required>
                <option value="صرف">صرف</option>
                <option value="قبض">قبض</option>
            </select>

            <label for="value">القيمة</label>
            <input type="number" id="value" name="value" required>

            <label for="price">السعر</label>
            <input id="price" type="number" step="0.000001" name="price" required>

            <label for="commission_type">نوع العوملة</label>
            <select id="commission_type" name="commission_type" required>
                <option value="يدوي">يدوي</option>
                <option value="نسبه">نسبه</option>
            </select>

            <label for="commission_rate">العوملة</label>
            <input type="number" step="any" id="commission_rate" name="commission_rate" required>

            <button type="submit" class="animate__animated animate__pulse">إرسال</button>

            <div id="errorMessage" class="error">حدث خطأ.</div>
            <div id="successMessage" class="success">تم اضافة المعاملة</div>
        </form>
        <div style="text-align:center; padding-top:2px; color:var(--primary-color);">
            <a href="index.html" class="hover:underline transition-all duration-300">عرض البيانات</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
// العناصر الرئيسية
        const form = document.getElementById('addTransactionForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const submitButton = form.querySelector('button[type="submit"]');
        const darkModeToggle = document.getElementById('darkModeToggle');

        // دالة لإرسال البيانات إلى API واحد
        async function sendToApi(url, formData) {
            return fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-API-Key': '1',  // استبدل بالقيمة الفعلية لمفتاح الـ API
                },
                body: JSON.stringify(formData),
            });
        }

        // دالة لتحديث الرسائل (نجاح أو خطأ)
        function updateMessage(isSuccess, message) {
            if (isSuccess) {
                successMessage.classList.add('show-message');
                errorMessage.classList.remove('show-message');
                successMessage.innerHTML = message || 'تم الإرسال بنجاح!';
                // عرض تأثير نجاح الرسالة
                anime({
                    targets: successMessage,
                    scale: [0.9, 1],
                    opacity: [0, 1],
                    duration: 1000,
                    easing: 'easeOutElastic(1, .5)',
                });
            } else {
                errorMessage.classList.add('show-message');
                successMessage.classList.remove('show-message');
                errorMessage.innerHTML = 'خطأ في إرسال  ';
                // عرض تأثير خطأ الرسالة
                anime({
                    targets: errorMessage,
                    translateX: [-10, 10, -10, 10, 0],
                    duration: 500,
                    easing: 'easeInOutQuad',
                });
            }
        }

        // دالة لمعالجة الطلب بعد الإرسال
        async function handleSubmit(event) {
            event.preventDefault();
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
            submitButton.disabled = true;

            const formData = getFormData();
            const apiUrls = [
                'https://fastapi-project-ten.vercel.app/api/v1/add-trans/',
                'https://excle-fastapi-vercle.vercel.app/api/v1/add-trns-excl/',
            ];

            try {
                // إرسال الطلبات إلى الـ APIs
                const responses = await Promise.all(apiUrls.map(url => sendToApi(url, formData)));
                const allSuccess = responses.every(response => response.ok);

                if (allSuccess) {
                    updateMessage(true, 'تم أضافة البيانات بنجاح    ');
                    form.reset();  // إعادة ضبط النموذج
                } else {
                    const errorData = await Promise.all(responses.map(response => response.json()));
                    throw new Error(JSON.stringify(errorData));
                }
            } catch (error) {
                console.error('Error:', error);
                updateMessage(false, error.message);
            } finally {
                submitButton.innerHTML = 'إرسال';
                submitButton.disabled = false;
            }
        }

        // استخراج بيانات النموذج
        function getFormData() {
            return {
                commission_type: document.getElementById('commission_type').value,
                transaction_type: document.getElementById('transaction_type').value,
                name: document.getElementById('name').value,
                country: document.getElementById('country').value,
                city: document.getElementById('city').value,
                value: parseFloat(document.getElementById('value').value),
                price: parseFloat(document.getElementById('price').value),
                customer_name: document.getElementById('customer_name').value,
                commission_rate: parseFloat(document.getElementById('commission_rate').value),
            };
        }

        // إضافة مستمع الحدث للنموذج
        form.addEventListener('submit', handleSubmit);

        // تأثير الرسوم المتحركة للخلفية
        anime({
            targets: '.container',
            backgroundColor: ['hsl(230, 50%, 95%)', 'hsl(230, 50%, 90%)', 'hsl(230, 50%, 95%)'],
            duration: 10000,
            direction: 'alternate',
            loop: true,
            easing: 'easeInOutQuad',
        });

    </script>
</body>
</html>

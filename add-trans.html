<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اضافة معاملة جديدة</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
:root {
    --primary-color: #6d28d9;
    --secondary-color: #4c1d95;
    --background-color: #f3f4f6;
    --text-color: #1f2937;
    --hover-color: #5b21b6;
    --card-bg: #ffffff;
    --border-color: #d1d5db;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--background-color);
    color: var(--text-color);
    transition: background-color 0.3s, color 0.3s;
}

.container {
    width: 90%; /* Use a percentage for width */
    max-width: 800px; 
    margin: 30px auto; /* Reduced top margin */
    background-color: var(--card-bg);
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

h1 {
    font-size: 2rem;
    margin-bottom: 1.5rem;
    color: var(--secondary-color); 
    text-align: center;
}

label {
    font-weight: 600;
    margin-bottom: 0.5rem;
    display: block;
}

input, select {
    width: 100%;
    padding: 0.75rem 1rem; 
    margin-bottom: 1rem; /* Reduced margin */
    border: 1px solid var(--border-color);
    border-radius: 8px;
    transition: all 0.3s;
}

input:focus, select:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.2);
}

button {
    width: 100%;
    padding: 0.75rem 1rem;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.3s;
}

button:hover {
    background-color: var(--hover-color);
    transform: translateY(-2px);
}

.error {
    color: red;
    margin-bottom: 1rem;
}

.success {
    color: green;
    margin-bottom: 1rem;
}


@media (max-width: 768px) { 
    h1 {
        font-size: 1.75rem; /* Adjust h1 size for smaller screens */
    }
    label {
        font-size: 0.9rem; /* Slightly smaller label text */
    }
    input, select {
        font-size: 0.9rem; /* Adjust input/select text */
        padding: 0.6rem 0.8rem;
    }
    button {
        font-size: 0.9rem; /* Adjust button text */
        padding: 0.6rem 0.8rem; 
    }

}
    </style>
</head>
<body>
    <div class="container">
        <h1>اضافة معاملة</h1>
        <form id="addTransactionForm">
            <label for="name">اسم الزبون</label>
            <input type="text" id="name" name="name" value="ail" required>
            
            <label for="customer_name">المستلم</label>
            <input type="text" id="customer_name" name="customer_name" value="ail" required>
            
            <label for="country">البلد</label>
            <select id="country" name="country" required>
                <option value="تونسي">تونسي</option>
                <option value="مصري">مصري</option>
                <option value="دولار">دولار</option>
                <option value="يورو">يورو</option>
            </select>
            <label for="city">المدينة</label>
            <input type="text" id="city" name="city" required>
            
            <label for="transaction_type">نوع العملية</label>
            <select id="transaction_type" name="transaction_type" required>
                <option value="صرف">صرف</option>
                <option value="قبض">قبض</option>
            </select>
            <label for="value">القيمة</label>
            <input type="number" id="value" name="value" required>

            <label for="price">السعر</label>
            <input type="number" id="price" name="price" required>


            <label for="commission_type">نوع العوملة</label>
            <select id="commission_type" name="commission_type" required>
                <option value="يدوي">يدوي</option>
                <option value="نسبه">نسبه</option>
            </select>
            <label for="commission_rate">العوملة</label>
            <input type="number" id="commission_rate" name="commission_rate" required>
            

            
            

            <button type="submit">Submit</button>

            <div id="errorMessage" class="error" style="display: none;">Error submitting the form. Please try again.</div>
            <div id="successMessage" class="success" style="display: none;">Transaction added successfully!</div>
        </form>
    </div>
    <script>
        const form = document.getElementById('addTransactionForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                commission_type: document.getElementById('commission_type').value,
                transaction_type: document.getElementById('transaction_type').value,
                name: document.getElementById('name').value,
                country: document.getElementById('country').value,
                city: document.getElementById('city').value,
                value: parseFloat(document.getElementById('value').value),
                price: parseFloat(document.getElementById('price').value),
                customer_name: document.getElementById('customer_name').value,
                commission_rate: parseFloat(document.getElementById('commission_rate').value),
            };

            try {
                const response = await fetch('https://trns-app.vercel.app/api/add-trns', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'accept': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    const data = await response.json();
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    form.reset();
                    console.log('Success:', data);
                } else {
                    const errorData = await response.json();
                    throw new Error(JSON.stringify(errorData));
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.style.display = 'block';
                errorMessage.innerHTML = 'Error submitting the form: ' + error.message;
                successMessage.style.display = 'none';
            }
        });
    </script>

</body>
</html>
